<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#16181d;--muted:#6b7280;--border:#e2e5ea;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--input:#f0f2f5;--accent:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--text:#eceef2;--muted:#9aa1ad;--border:#2a2e37;--input:#232730;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px 48px}
h1{text-align:center;font-size:2.6rem;letter-spacing:.04em;margin:8px 0 12px}
.barra{max-width:1100px;margin:0 auto 18px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.barra button{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:10px;padding:9px 16px;font-size:.95rem;cursor:pointer}
.barra button.primario{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.barra button:disabled{opacity:.45;cursor:default}
#estado{font-size:.85rem;color:var(--muted)}
#estado.warn{color:var(--yellow)}#estado.err{color:var(--red)}#estado.ok{color:var(--green)}
main{max-width:1100px;margin:0 auto;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
section.lugar{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
section.lugar>h2{margin:0 0 14px;font-size:1.4rem;text-align:center}
.bloque{border-top:1px solid var(--border);padding:14px 0 6px}
.bloque h3{margin:0 0 12px;font-size:1rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.chartwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none;background:var(--border)}
.donut::after{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--card)}
.donut b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;font-size:1.3rem;line-height:1}
.donut b small{font-size:.65rem;color:var(--muted);font-weight:400;margin-top:3px}
.stats{display:grid;gap:8px;flex:1;min-width:150px}
.stat{display:flex;align-items:center;gap:8px;font-size:.88rem}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.stat label{flex:1}
.stat input{width:64px;padding:6px 8px;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:8px;font-size:.95rem;text-align:center}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--border);margin:14px 0 4px}
.bar span{display:block;height:100%;transition:width .25s}
.links{margin-top:14px}
.links h4,.jugadas h4{margin:0 0 8px;font-size:.8rem;color:var(--muted);font-weight:600}
.link{display:flex;gap:6px;margin-bottom:6px}
.link input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:8px;font-size:.85rem}
.link a,.link button,.add{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:8px;padding:6px 10px;font-size:.8rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.jugadas{margin-top:14px}
.jrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--border)}
.jrow .jn{flex:1 1 100%;min-width:0;padding:7px 9px;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:8px;font-size:.88rem}
.jrow .jk{width:58px;padding:6px;border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:8px;font-size:.9rem;text-align:center}
.jrow small{color:var(--muted);font-size:.78rem}
.jrow .pct{margin-left:auto;font-weight:700;color:var(--green);min-width:52px;text-align:right}
.jrow button{border:1px solid var(--border);background:var(--input);color:var(--text);border-radius:8px;padding:5px 9px;font-size:.8rem;cursor:pointer}
</style>
</head>
<body>
<h1>Line</h1>
<div class="barra">
  <button id="btnGuardar" class="primario" disabled>Guardar</button>
  <button id="btnRecargar">Recargar</button>
  <span id="estado">Cargando…</span>
</div>
<main id="app"></main>
<script>
var LUGARES=[["santboi","Santboi"],["vrac","Vrac"],["burgos","Burgos"]];
var TIPOS=[["ataque","Ataque"],["defensa","Defensa"]];
var CAMPOS=[["g","Tiros ganados","var(--green)"],["d","Tiros ganados con dificultad","var(--yellow)"],["p","Tiros perdidos","var(--red)"]];
var data=norm(null),dirty=false,busy=false,ver=0;
var app=document.getElementById("app"),estado=document.getElementById("estado"),btnG=document.getElementById("btnGuardar"),btnR=document.getElementById("btnRecargar");

function n0(v){v=parseInt(v);return v>0?v:0;}
function norm(src){
  var o={};
  LUGARES.forEach(function(l){o[l[0]]={};TIPOS.forEach(function(t){
    var s=(src&&src[l[0]]&&src[l[0]][t[0]])||{};
    var x={g:n0(s.g),d:n0(s.d),p:n0(s.p),links:Array.isArray(s.links)?s.links.map(String):[]};
    if(t[0]==="ataque")x.jugadas=(Array.isArray(s.jugadas)?s.jugadas:[]).map(function(j){return{n:String((j&&j.n)||""),a:n0(j&&j.a),t:n0(j&&j.t)};});
    o[l[0]][t[0]]=x;
  });});
  return o;
}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e;}
function url(u){u=(u||"").trim();if(u&&!/^https?:\/\//i.test(u))u="https://"+u;return u;}
function hora(){return new Date().toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});}
function setEstado(t,c){estado.textContent=t;estado.className=c||"";}
function markDirty(){ver++;dirty=true;btnG.disabled=false;setEstado("Cambios sin guardar","warn");}

function buildJugadas(d){
  var w=el("div","jugadas");w.appendChild(el("h4","","Jugadas que se hicieron en el partido"));
  var list=el("div");w.appendChild(list);
  function numInput(val,cb){var i=document.createElement("input");i.type="number";i.min="0";i.step="1";i.className="jk";i.value=val;i.addEventListener("input",function(){cb(n0(i.value));});return i;}
  function draw(){
    list.innerHTML="";
    d.jugadas.forEach(function(j,idx){
      var r=el("div","jrow"),n=document.createElement("input");
      n.type="text";n.className="jn";n.placeholder="Nombre de la jugada";n.value=j.n;
      n.addEventListener("input",function(){j.n=n.value;markDirty();});
      var pc=el("span","pct");
      function upd(){pc.textContent=j.t>0?(Math.round(j.a/j.t*1000)/10)+"%":"\u2013";}
      r.appendChild(n);
      r.appendChild(numInput(j.a,function(v){j.a=v;upd();markDirty();}));
      r.appendChild(el("small","","acertados de"));
      r.appendChild(numInput(j.t,function(v){j.t=v;upd();markDirty();}));
      r.appendChild(el("small","","intentos"));
      r.appendChild(pc);
      var x=el("button","","\u2715");x.title="Quitar";
      x.addEventListener("click",function(){d.jugadas.splice(idx,1);markDirty();draw();});
      r.appendChild(x);upd();list.appendChild(r);
    });
  }
  draw();
  var add=el("button","add","+ A\u00f1adir jugada");
  add.addEventListener("click",function(){d.jugadas.push({n:"",a:0,t:0});markDirty();draw();var ins=list.querySelectorAll(".jn");if(ins.length)ins[ins.length-1].focus();});
  w.appendChild(add);
  return w;
}

function build(lk,tk){
  var d=data[lk][tk],b=el("div","bloque");
  b.appendChild(el("h3","",tk==="ataque"?"Ataque":"Defensa"));
  var w=el("div","chartwrap"),donut=el("div","donut"),ctr=el("b","","0<small>tiros</small>");
  donut.appendChild(ctr);w.appendChild(donut);
  var st=el("div","stats");
  CAMPOS.forEach(function(c){
    var r=el("div","stat");
    var dot=el("span","dot");dot.style.background=c[2];r.appendChild(dot);
    r.appendChild(el("label","",c[1]));
    var i=document.createElement("input");i.type="number";i.min="0";i.step="1";i.value=d[c[0]];
    i.addEventListener("input",function(){d[c[0]]=n0(i.value);paint();markDirty();});
    r.appendChild(i);st.appendChild(r);
  });
  w.appendChild(st);b.appendChild(w);
  var bar=el("div","bar"),segs=CAMPOS.map(function(c){var sp=el("span");sp.style.background=c[2];bar.appendChild(sp);return sp;});
  b.appendChild(bar);
  function paint(){
    var t=d.g+d.d+d.p,gp=t?d.g/t*100:0,dp=t?d.d/t*100:0;
    donut.style.background=t?"conic-gradient(var(--green) 0 "+gp+"%,var(--yellow) "+gp+"% "+(gp+dp)+"%,var(--red) "+(gp+dp)+"% 100%)":"var(--border)";
    ctr.innerHTML=t+"<small>tiros</small>";
    [d.g,d.d,d.p].forEach(function(v,k){segs[k].style.width=(t?v/t*100:0)+"%";});
  }
  paint();
  if(tk==="ataque")b.appendChild(buildJugadas(d));
  var lw=el("div","links");lw.appendChild(el("h4","","Enlaces"));
  var list=el("div");lw.appendChild(list);
  function drawLinks(){
    list.innerHTML="";
    d.links.forEach(function(u,idx){
      var r=el("div","link"),i=document.createElement("input");
      i.type="text";i.placeholder="Pega aqu\u00ed un enlace";i.value=u;
      var a=el("a","","Abrir");a.target="_blank";a.rel="noopener";
      function ref(){var n=url(i.value);if(n){a.href=n;a.style.visibility="visible";}else{a.removeAttribute("href");a.style.visibility="hidden";}}
      i.addEventListener("input",function(){d.links[idx]=i.value;ref();markDirty();});
      ref();r.appendChild(i);r.appendChild(a);
      var x=el("button","","\u2715");x.title="Quitar";
      x.addEventListener("click",function(){d.links.splice(idx,1);markDirty();drawLinks();});
      r.appendChild(x);list.appendChild(r);
    });
  }
  drawLinks();
  var add=el("button","add","+ A\u00f1adir enlace");
  add.addEventListener("click",function(){d.links.push("");markDirty();drawLinks();var ins=list.querySelectorAll("input");if(ins.length)ins[ins.length-1].focus();});
  lw.appendChild(add);b.appendChild(lw);
  return b;
}

function render(){
  app.innerHTML="";
  LUGARES.forEach(function(l){
    var sec=el("section","lugar");sec.appendChild(el("h2","",l[1]));
    TIPOS.forEach(function(t){sec.appendChild(build(l[0],t[0]));});
    app.appendChild(sec);
  });
}

function cargar(manual){
  if(busy)return;
  if(dirty){
    if(!manual)return;
    if(!confirm("Tienes cambios sin guardar. \u00bfRecargar y perderlos?"))return;
  }
  if(!manual&&document.activeElement&&/INPUT/.test(document.activeElement.tagName))return;
  setEstado("Cargando\u2026");
  google.script.run
    .withSuccessHandler(function(s){
      data=norm(JSON.parse(s));dirty=false;btnG.disabled=true;render();
      setEstado("Datos al d\u00eda \u00b7 "+hora(),"ok");
    })
    .withFailureHandler(function(e){setEstado("Error al cargar: "+((e&&e.message)||e),"err");})
    .getData();
}

function guardar(){
  if(busy||!dirty)return;
  busy=true;btnG.disabled=true;setEstado("Guardando\u2026");
  var v=ver;
  google.script.run
    .withSuccessHandler(function(){
      busy=false;
      if(ver===v){dirty=false;btnG.disabled=true;setEstado("Guardado \u00b7 "+hora(),"ok");}
      else{btnG.disabled=false;setEstado("Cambios sin guardar","warn");}
    })
    .withFailureHandler(function(e){busy=false;btnG.disabled=false;setEstado("Error al guardar: "+((e&&e.message)||e),"err");})
    .saveData(JSON.stringify(data));
}

btnG.addEventListener("click",guardar);
btnR.addEventListener("click",function(){cargar(true);});
window.addEventListener("beforeunload",function(e){if(dirty){e.preventDefault();e.returnValue="";}});
cargar(true);
setInterval(function(){cargar(false);},30000);
</script>
</body>
</html>
